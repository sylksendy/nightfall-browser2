
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zen Web</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #10121b;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #202331;
}
button, input {
  padding: 12px;
  border: 0;
  border-radius: 9px;
}
button {
  cursor: pointer;
  background: #34384b;
  color: white;
}
input {
  flex: 1;
  min-width: 0;
  background: #fff;
  color: #111;
}
main { text-align: center; padding: 32px 16px; }
h1 { font-size: 42px; margin-bottom: 8px; }
p { color: #abb0c5; }
iframe {
  width: 100%;
  height: 65vh;
  border: 0;
  background: white;
}
#viewer { display: none; }
</style>
</head>
<body>
<header>
  <button onclick="goBack()">←</button>
  <button onclick="goForward()">→</button>
  <button onclick="goHome()">⌂</button>
  <input id="address" placeholder="Search or enter URL">
  <button onclick="navigate()">Go</button>
</header>

<main id="home">
  <h1>ZEN WEB</h1>
  <p>Your personal browser workspace</p>
  <p>Enter a website or search above.</p>
</main>

<section id="viewer">
  <iframe id="page" title="Website viewer"></iframe>
</section>

<script>
const address = document.getElementById("address");
const frame = document.getElementById("page");
const home = document.getElementById("home");
const viewer = document.getElementById("viewer");

let historyList = [];
let current = -1;

function getUrl(value) {
  value = value.trim();
  if (!value) return null;
  if (/^https?:\/\//i.test(value)) {
    return value;
  }
  if (/^[\w-]+(\.[\w-]+)+(?::\d+)?(\/.*)?$/.test(value)) {
    return "https://" + value;
  }
  return "https://www.google.com/search?q=" +
    encodeURIComponent(value);
}

function display(url) {
  home.style.display = "none";
  viewer.style.display = "block";
  frame.src = url;
  address.value = url;
}

function navigate() {
  const url = getUrl(address.value);
  if (!url) return;
  historyList = historyList.slice(0, current + 1);
  historyList.push(url);
  current++;
  display(url);
}

function goBack() {
  if (current > 0) display(historyList[--current]);
}

function goForward() {
  if (current < historyList.length - 1) {
    display(historyList[++current]);
  }
}

function goHome() {
  frame.src = "about:blank";
  viewer.style.display = "none";
  home.style.display = "block";
  address.value = "";
}

address.addEventListener("keydown", e => {
  if (e.key === "Enter") navigate();
});
</script>
</body>
</html>
